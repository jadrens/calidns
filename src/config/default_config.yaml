# DNS Server configuration — generated when the config file is missing.
# See docs/CONFIG.md for all options.

server:
  # Generated from active, non-loopback interfaces at first start.
  listen: []
  geoip:
    enable_mmap: false          # false: heap index; true: file-backed mmap index
    update_url: "https://cdn.jsdelivr.net/gh/v2fly/geoip@release/geoip.dat"
    update_interval: "24h"      # Next update is based on geoip.dat mtime
  api:
    enabled: false
    listen: ":3101"
    dashboard:
      url: "default"              # Or an HTTP(S) ZIP containing a dist tree
      update_interval: "24h"      # Used only for a remote ZIP
    tokens:
      - "changeme-please-replace-with-a-secure-token"
    # cors:
    #   allow_origins: ["*"]
    #   allow_methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
    #   allow_headers: ["Content-Type", "Authorization"]
    #   expose_headers: []
    #   max_age: 0
    #   allow_credentials: false

# Leave cluster unset for standalone operation.
# cluster:
#   mode: master
#   slaves: ["ns2.example.com"]
# Or:
# cluster:
#   mode: slave
#   master: "ns1.example.com"

# Query and EDNS history. SQLite is suitable for a standalone server.
# Set type: postgres and configure host/user/password/db_name to use PostgreSQL.
database:
  type: "sqlite"
  sqlite_path: "queries.db"     # Relative to the data directory
  # host: "127.0.0.1:5432"
  # user: "dns"
  # password: "replace-this-password"
  # db_name: "dns_db"

# Optional bundled commercial GeoIP fallback. Its vendor-specific code and
# configuration are isolated in the external_api package.
external_api:
  geo_ip_api_key: "none"

# DNS zones and Web-API-managed defaults live in the data directory's dns_data.db.
# A new database starts with TTL 300, recording disabled, and REFUSED replies.
